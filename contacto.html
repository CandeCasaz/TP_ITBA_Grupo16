<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mueblería Hermanos Jota</title>
    <link rel="stylesheet" href="estilos.css" />
</head>
<body>
 <header class="encabezado">
    <div class="contenedor nav">
      <a href="index.html" class="nav__marca">
        <img src="img/logo.svg" alt="" class="nav__logo" />
        Hermanos <span>Jota</span>
      </a>

      <input class="nav__checkbox" type="checkbox" id="menu-toggle" />
      <label class="nav__toggle" for="menu-toggle"><span aria-hidden="true">☰</span></label>

      <ul class="nav__menu" id="menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html" aria-current="page">Productos</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>

      <span class="boton-carrito">Carrito (<span id="contador-carrito">0</span>)</span>
    </div>
  </header>


    <main>
    <section class="seccion">
      <div class="contacto" id="contacto">
        <h2>Contactanos</h2>

            <form id="form-contacto">

                <div>
                    <label for="nombre">Nombre:</label>
                    <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingresá tu nombre"
                    >
        
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="ejemplo@email.com"
                    >
                </div>
                <div>
                    <label for="mensaje">Mensaje:</label>
                    <textarea
                    id="mensaje"
                    name="mensaje"
                    rows="6"
                    placeholder="Escribí tu mensaje..."
                    ></textarea>
                </div>

                <button type="submit">Enviar</button>
                <p id="mensaje-exito"></p>
            </form>
      </div>
    </section>
    </main>

  <footer class="pie-pagina">
    <div class="contenedor">
      <p class="pie-pagina__marca">Hermanos <span>Jota</span></p>
      <p>© 2026 Hermanos Jota. Redescubriendo el arte de vivir</p>
    </div>
  </footer>

  <script src="contacto.js"></script>

</body>
</html>
